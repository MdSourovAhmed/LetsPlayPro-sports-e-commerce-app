# Usage: kind create cluster --config k8s/kind-config.yaml --name letsplaypro
#
# Each entry under `nodes:` becomes its own Docker container acting as a real node — this
# config now has 1 control-plane + 3 workers, i.e. 4 containers total, instead of one
# container doing every job. This is what makes the cluster behave like a real one:
#   - The scheduler now has an actual CHOICE of where to place pods, so replicas of a
#     Deployment can land on different physical (well, containerized) nodes instead of
#     just different processes on the same one.
#   - The control-plane node keeps its default taint (node-role.kubernetes.io/control-plane:
#     NoSchedule) now that there's somewhere else for workloads to go — kind only removes
#     that taint on single-node clusters, where there'd be nowhere else to run anything.
#   - `kind load docker-image` (used by build-and-load.sh) automatically pushes the image to
#     EVERY node in the cluster, so no extra step is needed for the multi-node image loading
#     to work.
#
# The port mapping still lives on the control-plane node — that's the only node whose ports
# are exposed to your host machine, which is why the ingress controller is pinned there too
# (see the ingress-ready label below and k8s/README.md for the ingress-nginx install command).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload-tier=general"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload-tier=general"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload-tier=general"
