# Copy to grafana-cloud-secret.yaml (gitignored — see k8s/.gitignore) and fill in real values
# before installing the k8s-monitoring Helm chart. Kept as its own Secret rather than folded
# into letsplaypro-secrets — the app services never read these, only Alloy does, and app
# secrets vs. observability-tooling secrets tend to have different owners and rotation
# schedules even on a small team. No harm in it being one Secret if that's simpler for you;
# just don't let the app's own Deployments reference keys from this one, or the boundary
# stops meaning anything.
#
# Where to find these values: Grafana Cloud → your stack → Connections → search
# "Kubernetes" → the setup page shows your exact Prometheus/Loki push URLs and instance IDs
# for YOUR stack (these vary by account/region — don't reuse the ones from a doc example).
# The password for both is the same thing: a Grafana Cloud Access Policy token with
# metrics:write + logs:write scope (Administration → Access Policies → Create access policy).
#
#   cp grafana-cloud-secret.example.yaml grafana-cloud-secret.yaml
#   # edit grafana-cloud-secret.yaml with your real values
#   kubectl apply -f grafana-cloud-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: letsplaypro
type: Opaque
stringData:
  PROMETHEUS_URL: https://prometheus-prod-XX-prod-xx-region.grafana.net/api/prom/push
  PROMETHEUS_USERNAME: "your-instance-id"
  LOKI_URL: https://logs-prod-XXX.grafana.net/loki/api/v1/push
  LOKI_USERNAME: "your-instance-id"
  # Same Access Policy token, used as the password for both above
  ACCESS_POLICY_TOKEN: glc_eXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX