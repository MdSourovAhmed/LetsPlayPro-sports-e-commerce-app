apiVersion: v1
kind: ConfigMap
metadata:
  name: letsplaypro-config
  namespace: letsplaypro
data:
  # Kubernetes gives every Service a DNS name within its namespace — a Service named
  # "auth-service" is reachable at "http://auth-service:3001" from any pod in the same
  # namespace, same as the docker-compose container_name-based hostnames these services
  # already expect. Nothing in the application code needs to know it's running in k8s.
  AUTH_SERVICE_URL: http://auth-service:3001
  PRODUCT_SERVICE_URL: http://product-service:3002
  ORDER_SERVICE_URL: http://order-service:3003
  DASHBOARD_SERVICE_URL: http://dashboard-service:3004
  PAYMENT_SERVICE_URL: http://payment-service:3005

  RABBITMQ_URL: amqp://rabbitmq:5672
  REDIS_URL: redis://redis:6379

  MONGO_URI_AUTH: mongodb://mongo-auth:27017/auth-service
  MONGO_URI_PRODUCT: mongodb://mongo-product:27017/product-service
  MONGO_URI_ORDER: mongodb://mongo-order:27017/order-service
  MONGO_URI_PAYMENT: mongodb://mongo-payment:27017/payment-service

  # dashboard-service reads the same three databases directly (read-only) and expects these
  # exact env var names — see docker-compose.yml, same convention carried over here.
  AUTH_MONGO_URI: mongodb://mongo-auth:27017/auth-service
  PRODUCT_MONGO_URI: mongodb://mongo-product:27017/product-service
  ORDER_MONGO_URI: mongodb://mongo-order:27017/order-service
  LOW_STOCK_THRESHOLD: "5"

  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_DAYS: "30"
  RESET_TOKEN_EXPIRES_MINUTES: "30"
