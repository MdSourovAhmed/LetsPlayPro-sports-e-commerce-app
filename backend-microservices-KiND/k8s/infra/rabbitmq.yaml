apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: letsplaypro
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
          readinessProbe:
            tcpSocket:
              port: 5672
            # exec: { command: ["rabbitmq-diagnostics", "check_port_connectivity"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5672
            # exec: { command: ["rabbitmq-diagnostics", "check_running"] }
            initialDelaySeconds: 40          # ← was 10 – this is the main fix
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: letsplaypro
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
