apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-order-pvc
  namespace: letsplaypro
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-order
  namespace: letsplaypro
spec:
  replicas: 1
  strategy: { type: Recreate } # avoid two pods ever mounting the same PVC at once
  selector:
    matchLabels: { app: mongo-order }
  template:
    metadata:
      labels: { app: mongo-order }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec: { command: ["mongosh", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["mongosh", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 40          # ← was 10 – this is the main fix
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-order-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-order
  namespace: letsplaypro
spec:
  selector: { app: mongo-order }
  ports: [{ port: 27017, targetPort: 27017 }]
