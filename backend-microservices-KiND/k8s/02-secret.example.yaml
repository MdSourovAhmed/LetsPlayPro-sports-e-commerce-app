# Copy this file to 02-secret.yaml (already gitignored — see k8s/.gitignore) and fill in real
# values before applying. Never commit actual secrets to version control, including in a
# private repo — treat every secret here as if it will leak eventually, because eventually
# one will.
#
#   cp 02-secret.example.yaml 02-secret.yaml
#   # edit 02-secret.yaml with real values
#   kubectl apply -f 02-secret.yaml
#
# For real deployments beyond local kind/minikube practice, prefer a proper secrets manager
# (Sealed Secrets, External Secrets Operator, or your cloud provider's) over plain Kubernetes
# Secrets, which are only base64-encoded, not encrypted, at rest by default.
apiVersion: v1
kind: Secret
metadata:
  name: letsplaypro-secrets
  namespace: letsplaypro
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-string
  GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
  STRIPE_SECRET_KEY: sk_test_your_secret_key
  STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: "LetsPlayPro <no-reply@letsplaypro.com>"
