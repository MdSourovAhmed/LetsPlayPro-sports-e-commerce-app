# A PodDisruptionBudget (PDB) only governs VOLUNTARY disruptions — a node being drained for
# maintenance, a cluster upgrade, `kubectl drain`. It does nothing for involuntary ones (a
# node crashing outright, a pod OOM-killed) — those are what the Deployment's replica count
# and the HPA are already for.
#
# minAvailable: 1 means "you may evict pods for maintenance one at a time, but never let
# fewer than 1 healthy replica exist while doing it." With only 2 replicas (the current
# minReplicas on these two services), that's the most conservative useful setting — anything
# stricter would mean draining a node blocks entirely whenever this service has a pod on it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: letsplaypro
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service
  namespace: letsplaypro
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: product-service }
