apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: letsplaypro
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
      annotations:
        # k8s.grafana.com/* (not the older prometheus.io/* convention) — this is the actual
        # default annotation the Grafana Kubernetes Monitoring Helm chart's Annotation
        # Autodiscovery feature looks for. No ServiceMonitor CRD, no Prometheus Operator
        # required. See k8s/observability/README.md.
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3002"
        k8s.grafana.com/metrics.path: "/metrics"
        # Explicit job name so Prometheus's "job" label is exactly "product-service" — predictable and
        # stable to query on, rather than whatever the chart would otherwise derive.
        k8s.grafana.com/job: "product-service"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: product-service }
      containers:
        - name: product-service
          image: letsplaypro/product-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: letsplaypro-config }
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom: { configMapKeyRef: { name: letsplaypro-config, key: MONGO_URI_PRODUCT } }
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: CLOUDINARY_CLOUD_NAME } }
            - name: CLOUDINARY_API_KEY
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: CLOUDINARY_API_KEY } }
            - name: CLOUDINARY_API_SECRET
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: CLOUDINARY_API_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: letsplaypro
spec:
  selector: { app: product-service }
  ports: [{ port: 3002, targetPort: 3002 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  namespace: letsplaypro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 8 # highest-traffic read path in the whole system — give it the most headroom
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
