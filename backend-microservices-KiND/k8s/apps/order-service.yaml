apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: letsplaypro
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        # k8s.grafana.com/* (not the older prometheus.io/* convention) — this is the actual
        # default annotation the Grafana Kubernetes Monitoring Helm chart's Annotation
        # Autodiscovery feature looks for. No ServiceMonitor CRD, no Prometheus Operator
        # required. See k8s/observability/README.md.
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3003"
        k8s.grafana.com/metrics.path: "/metrics"
        # Explicit job name so Prometheus's "job" label is exactly "order-service" — predictable and
        # stable to query on, rather than whatever the chart would otherwise derive.
        k8s.grafana.com/job: "order-service"
    spec:
      containers:
        - name: order-service
          image: letsplaypro/order-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          envFrom:
            - configMapRef: { name: letsplaypro-config }
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_URI
              valueFrom: { configMapKeyRef: { name: letsplaypro-config, key: MONGO_URI_ORDER } }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: letsplaypro
spec:
  selector: { app: order-service }
  ports: [{ port: 3003, targetPort: 3003 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: letsplaypro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
