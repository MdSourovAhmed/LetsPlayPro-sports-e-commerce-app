apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: letsplaypro
spec:
  # Deliberately NOT autoscaled and kept at 1: this is a plain RabbitMQ consumer with no
  # idempotency key on the emails it sends. Two replicas both bound to the same queue would
  # still only each get a share of the messages (RabbitMQ round-robins competing consumers on
  # one queue), so it wouldn't double-send everything — but it also wouldn't buy you anything
  # under load, since email sending is rarely the bottleneck. Scale this only if you've also
  # made send operations idempotent (e.g. dedupe on order id + event type).
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
      annotations:
        # k8s.grafana.com/* (not the older prometheus.io/* convention) — this is the actual
        # default annotation the Grafana Kubernetes Monitoring Helm chart's Annotation
        # Autodiscovery feature looks for. No ServiceMonitor CRD, no Prometheus Operator
        # required. See k8s/observability/README.md.
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3006"
        k8s.grafana.com/metrics.path: "/metrics"
        # Explicit job name so Prometheus's "job" label is exactly "notification-service" — predictable and
        # stable to query on, rather than whatever the chart would otherwise derive.
        k8s.grafana.com/job: "notification-service"
    spec:
      containers:
        - name: notification-service
          image: letsplaypro/notification-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3006 }]
          envFrom:
            - configMapRef: { name: letsplaypro-config }
          env:
            - name: PORT
              value: "3006"
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: SMTP_PORT } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: SMTP_PASS } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: letsplaypro-secrets, key: SMTP_FROM } }
          readinessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: letsplaypro
spec:
  selector: { app: notification-service }
  ports: [{ port: 3006, targetPort: 3006 }]
