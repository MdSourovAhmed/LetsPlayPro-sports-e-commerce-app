apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: letsplaypro
spec:
  replicas: 1 # deliberately not autoscaled — see README's "known limitations" on this service
  selector:
    matchLabels: { app: dashboard-service }
  template:
    metadata:
      labels: { app: dashboard-service }
      annotations:
        # k8s.grafana.com/* (not the older prometheus.io/* convention) — this is the actual
        # default annotation the Grafana Kubernetes Monitoring Helm chart's Annotation
        # Autodiscovery feature looks for. No ServiceMonitor CRD, no Prometheus Operator
        # required. See k8s/observability/README.md.
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3004"
        k8s.grafana.com/metrics.path: "/metrics"
        # Explicit job name so Prometheus's "job" label is exactly "dashboard-service" — predictable and
        # stable to query on, rather than whatever the chart would otherwise derive.
        k8s.grafana.com/job: "dashboard-service"
    spec:
      containers:
        - name: dashboard-service
          image: letsplaypro/dashboard-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3004 }]
          envFrom:
            - configMapRef: { name: letsplaypro-config }
          env:
            - name: PORT
              value: "3004"
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: letsplaypro
spec:
  selector: { app: dashboard-service }
  ports: [{ port: 3004, targetPort: 3004 }]
