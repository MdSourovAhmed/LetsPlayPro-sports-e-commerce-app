version: '3.8'

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Backs product-service's cache-aside product reads and the gateway's rate
  # limiters — both need a shared store once more than one replica of
  # either service is running (see product-service/utils/cache.js and
  # api-gateway/middleware/rateLimitStore.js for why).
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-auth:
    image: mongo:7
    container_name: mongo-auth
    volumes: [mongo-auth-data:/data/db]

  mongo-product:
    image: mongo:7
    container_name: mongo-product
    volumes: [mongo-product-data:/data/db]

  mongo-order:
    image: mongo:7
    container_name: mongo-order
    volumes: [mongo-order-data:/data/db]

  mongo-payment:
    image: mongo:7
    container_name: mongo-payment
    volumes: [mongo-payment-data:/data/db]

  # ─── Application services ────────────────────────────────────────────────────

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports: ['3000:3000']
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      DASHBOARD_SERVICE_URL: http://dashboard-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on: [auth-service, product-service, order-service, dashboard-service, payment-service, redis]
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MONGO_URI: mongodb://mongo-auth:27017/auth-service
      RABBITMQ_URL: amqp://rabbitmq
      JWT_SECRET: ${JWT_SECRET}
      # Short-lived on purpose — see auth-service/.env.example for why.
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      RESET_TOKEN_EXPIRES_MINUTES: 30
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Blank by default (see root .env.example) — POST /auth/admin-register 403s unless
      # this is explicitly set. Dev/test convenience only, never set in production.
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE}
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-auth: { condition: service_started }
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo-product:27017/product-service
      RABBITMQ_URL: amqp://rabbitmq
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-product: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo-order:27017/order-service
      RABBITMQ_URL: amqp://rabbitmq
      PAYMENT_SERVICE_URL: http://payment-service:3005
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-order: { condition: service_started }
      payment-service: { condition: service_started }
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Read-only aggregator for the admin dashboard's summary/analytics views.
  # Connects directly to all three other services' databases — see
  # dashboard-service/.env.example for the architectural tradeoff this
  # implies (speed/simplicity over strict service-boundary isolation).
  dashboard-service:
    build: ./dashboard-service
    container_name: dashboard-service
    environment:
      PORT: 3004
      AUTH_MONGO_URI: mongodb://mongo-auth:27017/auth-service
      PRODUCT_MONGO_URI: mongodb://mongo-product:27017/product-service
      ORDER_MONGO_URI: mongodb://mongo-order:27017/order-service
    depends_on:
      mongo-auth: { condition: service_started }
      mongo-product: { condition: service_started }
      mongo-order: { condition: service_started }
    restart: unless-stopped

  # Owns the actual Stripe integration. Talks directly to product-service
  # (internal network call, not through the gateway) to compute an
  # authoritative charge amount — see payment-service/controllers for why
  # that's the one function in this whole system allowed to decide "how
  # much money".
  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      PORT: 3005
      MONGO_URI: mongodb://mongo-payment:27017/payment-service
      RABBITMQ_URL: amqp://rabbitmq
      PRODUCT_SERVICE_URL: http://product-service:3002
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo-payment: { condition: service_started }
      product-service: { condition: service_started }
    restart: unless-stopped

volumes:
  mongo-auth-data:
  mongo-product-data:
  mongo-order-data:
  mongo-payment-data:
